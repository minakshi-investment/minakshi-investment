<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minakshi Investment</title>

<meta name="description"
content="Minakshi Investment - Registered Intermediaries and Empanelled Mutual Fund Companies">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 45px 25px 25px;
    text-align: center;
}

/* LOGO */

.logo {
    display: block;
    width: 125px;
    height: auto;
    margin: 0 auto 18px;
}

/* MAIN TITLE */

h1 {
    margin: 0 0 42px;
    font-size: 31px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 1px;
}

h2 {
    margin: 0 0 28px;
    font-size: 23px;
    font-weight: 700;
}

/* REGISTERED INTERMEDIARIES */

.intermediaries {
    text-align: left;
    display: inline-block;
    width: 100%;
    max-width: 690px;
}

.person {
    margin-bottom: 27px;
}

.person-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
}

.person-details {
    font-size: 15px;
    line-height: 1.65;
}

.person-details strong {
    font-weight: 700;
}

/* EMPANELLED FUNDS */

.empanelled {
    margin-top: 52px;
    text-align: left;
}

.empanelled h2 {
    text-align: center;
    margin-bottom: 22px;
}

/* SEARCH */

.search-box {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 18px;

    border: 1px solid #cfcfcf;
    border-radius: 4px;

    font-family: inherit;
    font-size: 14px;

    outline: none;
}

.search-box:focus {
    border-color: #777777;
}

/* TABLE */

.fund-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.fund-table th,
.fund-table td {
    border: 1px solid #d8d8d8;
    padding: 10px 12px;
    text-align: left;
    vertical-align: top;
}

.fund-table th {
    font-weight: 700;
    background: #f5f5f5;
}

.fund-table td:last-child {
    white-space: nowrap;
}

/* NO SEARCH RESULTS */

.no-results {
    display: none;
    text-align: center;
    padding: 20px;
    font-size: 14px;
    color: #666666;
}

/* FOOTER */

footer {
    margin-top: 55px;
    padding: 20px 0 10px;

    font-size: 13px;
    color: #555555;

    text-align: center;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 30px 17px 20px;
    }

    .logo {
        width: 105px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 35px;
    }

    h2 {
        font-size: 20px;
    }

    .person-name {
        font-size: 16px;
    }

    .person-details {
        font-size: 14px;
    }

    .fund-table {
        font-size: 13px;
    }

    .fund-table th,
    .fund-table td
